# Shared Mac: cap the build daemons and let Gradle's exit after 10 idle minutes (PM, 2026-10-28).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon.idletimeout=600000
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Play requires targetSdk 36; AGP 8.7 predates it but builds it fine.
android.suppressUnsupportedCompileSdk=36
